# 앱과 MySQL 을 한 번에 띄운다: docker compose up -d --build
# 절차와 문제 해결은 docs/운영.md 3장.

services:
  app:
    build: .
    image: stock-portfolio:local
    ports:
      - "8080:8080"
    # 키는 .env 에서 읽는다. 이미지에 굽지 않는다 (.dockerignore 에서 막음)
    env_file: .env
    environment:
      # .env 의 DB 주소는 내 PC 의 localhost 를 가리키므로 컨테이너 안에서는 mysql 서비스로 바꾼다
      DB_URL: jdbc:mysql://mysql:3306/portfolio?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      DB_USERNAME: portfolio
      DB_PASSWORD: ${COMPOSE_DB_PASSWORD:-portfolio}
    depends_on:
      mysql:
        # MySQL 은 컨테이너가 떠도 접속을 받기까지 몇 초 걸린다. 그 전에 앱이 뜨면 연결 실패로 죽는다
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: portfolio
      MYSQL_USER: portfolio
      MYSQL_PASSWORD: ${COMPOSE_DB_PASSWORD:-portfolio}
      MYSQL_ROOT_PASSWORD: ${COMPOSE_DB_ROOT_PASSWORD:-root}
      TZ: Asia/Seoul
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    # 바깥으로 포트를 열지 않는다. 앱만 붙으면 되고, 내 PC 의 MySQL(3306)과도 안 부딪힌다
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${COMPOSE_DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  mysql-data:
