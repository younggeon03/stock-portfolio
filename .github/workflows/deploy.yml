# main 의 CI 가 초록이면 서버에 배포한다. 손으로 특정 버전을 배포(=되돌리기)할 수도 있다.
#
# 흐름: CI(테스트 → 이미지 sha-xxxxxxx 를 ghcr.io 에) → 이 워크플로 → SSH → 서버의 deploy/deploy.sh
# deploy.sh 가 헬스체크를 보고, 실패하면 서버에서 바로 앞 버전으로 되돌린다.
#
# 필요한 저장소 Secrets (Settings → Secrets and variables → Actions). 없으면 배포를 건너뛴다:
#   DEPLOY_HOST         서버 IP 또는 도메인
#   DEPLOY_USER         SSH 사용자 (오라클 우분투는 ubuntu)
#   DEPLOY_SSH_KEY      배포 전용 개인키 (공개키는 서버 ~/.ssh/authorized_keys 에)
#   DEPLOY_KNOWN_HOSTS  ssh-keyscan 서버IP 결과. 중간자 공격을 막으려고 호스트 키를 고정한다
name: 배포

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "배포할 이미지 태그 (예: sha-1e9845b). 비우면 지금 main 커밋"
        required: false

# 배포는 한 번에 하나. 겹치면 앞의 것을 끝까지 하고 다음 것을 한다 (중간에 끊으면 서버 상태가 애매해진다)
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: read   # 서버가 ghcr.io 에서 이미지를 받을 때 이 작업의 토큰을 빌려 쓴다

jobs:
  deploy:
    name: 서버에 배포
    # CI 가 성공했고, PR 이 아니라 main 에 들어온 푸시일 때만
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # GitHub 의 "Environments" 화면에 배포 이력이 남는다. 보호 규칙(승인자)도 여기에 걸 수 있다
    environment: production
    env:
      HOST: ${{ secrets.DEPLOY_HOST }}
      USER_NAME: ${{ secrets.DEPLOY_USER }}
    steps:
      - name: 서버가 정해져 있나
        id: ready
        run: |
          if [ -z "$HOST" ] || [ -z "$USER_NAME" ]; then
            echo "::notice::DEPLOY_HOST·DEPLOY_USER 가 없어 배포를 건너뜁니다 (서버를 아직 안 만들었으면 정상)"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 배포할 태그 정하기
        if: steps.ready.outputs.go == 'true'
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          # CI 의 metadata-action 이 sha- + 앞 7자리로 태그를 붙인다. 같은 규칙으로 집는다
          tag="${INPUT_TAG:-sha-${RUN_SHA:0:7}}"
          if ! echo "$tag" | grep -Eq '^(sha-[0-9a-f]{7}|main)$'; then echo "태그 모양이 이상합니다: $tag"; exit 1; fi
          echo "value=$tag" >> "$GITHUB_OUTPUT"
          echo "### 배포 태그: \`$tag\`" >> "$GITHUB_STEP_SUMMARY"

      # 배포 스크립트·compose·Caddyfile 도 그 커밋의 것을 쓴다. 그래야 설정 변경도 코드와 같이 배포된다
      - uses: actions/checkout@v4
        if: steps.ready.outputs.go == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          sparse-checkout: deploy

      - name: SSH 준비
        if: steps.ready.outputs.go == 'true'
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          printf 'Host target\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/deploy\n  StrictHostKeyChecking yes\n' \
            "$HOST" "$USER_NAME" > ~/.ssh/config

      - name: 배포 파일 올리기
        if: steps.ready.outputs.go == 'true'
        # .env·backups 는 서버에만 있다. 여기서는 저장소에 있는 파일만 덮는다
        run: |
          ssh target 'mkdir -p ~/stock-portfolio'
          scp deploy/compose.yml deploy/Caddyfile deploy/env.example deploy/*.sh target:~/stock-portfolio/
          ssh target 'chmod +x ~/stock-portfolio/*.sh'

      - name: 배포 (실패하면 서버가 앞 버전으로 되돌림)
        if: steps.ready.outputs.go == 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          # 이미지 저장소 로그인은 이 작업 동안만 유효한 토큰으로. 서버에 오래 사는 토큰을 두지 않는다
          printf '%s' "$TOKEN" | ssh target "docker login ghcr.io -u '$ACTOR' --password-stdin" >/dev/null
          set +e
          ssh target "cd ~/stock-portfolio && ./deploy.sh '$TAG'"
          code=$?
          ssh target 'docker logout ghcr.io' >/dev/null
          exit $code
