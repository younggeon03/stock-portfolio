# 푸시와 PR 마다 테스트를 돌리고 도커 이미지가 만들어지는지 확인한다.
# 테스트는 바깥 API·DB 를 부르지 않게 짜 두어서 비밀값(키)이 하나도 필요 없다.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 같은 브랜치에 연달아 푸시하면 앞의 실행은 취소한다. 결과를 볼 필요가 없는 실행에 시간을 안 쓴다
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: 테스트와 패키징
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 테스트
        run: ./mvnw -B test

      - name: 테스트 리포트 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports
          retention-days: 7

      # 내 PC 는 경로에 한글이 있어 JaCoCo 에이전트 경로가 깨진다. 커버리지는 여기(리눅스)서만 잰다
      - name: 커버리지 요약
        if: always()
        run: |
          csv=target/site/jacoco/jacoco.csv
          if [ ! -f "$csv" ]; then echo "커버리지 보고서가 없습니다" >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          {
            echo "## 줄 커버리지"
            echo
            echo "| 패키지 | 커버 | 줄 |"
            echo "|---|---:|---:|"
            tail -n +2 "$csv" | awk -F, '{ p=$2; sub(/^com\.mystock\.portfolio\.?/, "", p); if (p=="") p="(루트)"; m[p]+=$8; c[p]+=$9; tm+=$8; tc+=$9 }
              END { for (p in m) printf "| %s | %d%% | %d/%d |\n", p, (m[p]+c[p]) ? c[p]*100/(m[p]+c[p]) : 0, c[p], m[p]+c[p];
                    printf "| **전체** | **%d%%** | %d/%d |\n", c_total=tc*100/(tm+tc), tc, tm+tc }' | sort
          } >> "$GITHUB_STEP_SUMMARY"

      # 계산 코드 패키지가 최소선 밑으로 떨어지면 막는다. 기준과 이유는 pom.xml 의 jacoco 설정 주석.
      # 요약(위)을 먼저 남기고 검사한다. 걸렸을 때 어느 패키지가 몇 % 인지 바로 보이게
      - name: 커버리지 최소선
        run: ./mvnw -B -q jacoco:check

      - name: 커버리지 보고서 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco
          retention-days: 7

      - name: jar 만들기
        run: ./mvnw -B -DskipTests package

  # 서버 배포 설정(deploy/)의 문법 검사. 합친 뒤 서버에서 처음 터지면 이미 운영 반영이 시작된 뒤다.
  # 키·DB 없이 돈다(더미 값으로 compose 를 해석만 하고, 컨테이너는 검사 도구로만 잠깐 띄운다)
  deploy-config:
    name: 배포 설정 검사
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # compose.yml 의 prometheus 와 같은 태그. 다른 버전으로 검사하면 서버에서 다른 결과가 날 수 있다
      PROM_IMAGE: prom/prometheus:v3.5.5
    steps:
      - uses: actions/checkout@v4

      # compose 는 .env 가 없으면 env_file 에서 멈춘다. 저장소에 없는 파일이라 빈 것을 만든다.
      # 필수값은 더미로 넘긴다(${VAR:?} 가 비면 해석이 멈춘다). 관측 profile 까지 켜서 전체를 본다
      - name: compose 해석
        env:
          DOMAIN: ci.example.com
          COMPOSE_DB_PASSWORD: dummy
          COMPOSE_DB_ROOT_PASSWORD: dummy
          GRAFANA_ADMIN_PASSWORD: dummy
        run: |
          touch deploy/.env
          docker compose -f deploy/compose.yml --profile monitoring config -q
          # 관측을 끈 서버(1GB)에서도 해석돼야 한다. Grafana 비밀번호가 없어도 앱 배포가 막히면 안 된다
          GRAFANA_ADMIN_PASSWORD= docker compose -f deploy/compose.yml config -q

      # Caddy 는 설정이 틀리면 컨테이너가 뜨자마자 죽어 사이트 전체가 내려간다. 서버에 가기 전에 여기서 잡는다
      - name: Caddyfile 검사
        run: docker run --rm -e DOMAIN=ci.example.com -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.8 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Prometheus 설정 검사 (promtool)
        run: docker run --rm --entrypoint promtool -v "$PWD/deploy/monitoring:/etc/prometheus:ro" "$PROM_IMAGE" check config /etc/prometheus/prometheus.yml

      # 알림 규칙의 문법과 단위 테스트(alerts.test.yml). 규칙을 고쳤는데 울려야 할 때 안 울리면 여기서 걸린다
      - name: 알림 규칙 검사·테스트 (promtool)
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/deploy/monitoring:/w:ro" -w /w "$PROM_IMAGE" check rules alerts.yml
          docker run --rm --entrypoint promtool -v "$PWD/deploy/monitoring:/w:ro" -w /w "$PROM_IMAGE" test rules alerts.test.yml

      # Alertmanager 설정 두 가지. 텔레그램 쪽은 컨테이너가 뜰 때처럼 chat_id 를 채워 본다(값은 가짜)
      - name: Alertmanager 설정 검사 (amtool)
        env:
          AM_IMAGE: prom/alertmanager:v0.30.0
        run: |
          mkdir -p /tmp/am
          sed "s/__CHAT_ID__/123456789/" deploy/monitoring/alertmanager/telegram.yml > /tmp/am/telegram.yml
          cp deploy/monitoring/alertmanager/quiet.yml /tmp/am/
          docker run --rm --entrypoint amtool -v /tmp/am:/w:ro -w /w "$AM_IMAGE" check-config telegram.yml quiet.yml

      - name: 대시보드 JSON 검사
        run: |
          for f in deploy/monitoring/grafana/dashboards/*.json; do
            jq empty "$f"
            # 프로비저닝은 uid 로 같은 대시보드를 찾아 덮는다. 비면 배포마다 새 대시보드가 생긴다
            jq -e '.uid != null and .uid != ""' "$f" >/dev/null || { echo "$f 에 uid 가 없습니다"; exit 1; }
          done

  docker:
    name: 도커 이미지 빌드
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    # 이미지 저장소(ghcr.io)에 올리려면 쓰기 권한이 필요하다. 이 작업에만 준다
    permissions:
      contents: read
      packages: write
    env:
      # main 에 합쳐졌을 때만 올린다. PR 은 만들어지는지만 확인한다 (남의 PR 이 이미지를 덮어쓰지 못하게)
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 이미지 저장소 로그인
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 태그 둘: 커밋 해시(되돌릴 때 정확히 이 버전을 집는다)와 main(가장 최근)
      - name: 태그 정하기
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=main,enable=${{ env.PUBLISH == 'true' }}

      - name: 이미지 빌드 (main 이면 저장소에 올림)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
