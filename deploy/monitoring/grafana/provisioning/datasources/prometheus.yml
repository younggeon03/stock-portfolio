# Grafana 가 기동할 때 읽는 데이터소스. 화면에서 손으로 만들지 않아야 서버를 새로 깔아도 그대로 뜬다
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    # 대시보드 JSON 이 이 uid 를 직접 가리킨다. 바꾸면 대시보드의 모든 패널이 "데이터소스 없음" 이 된다
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    # 원본은 이 파일이다. 화면에서 고친 내용은 다음 기동 때 사라지니 아예 못 고치게 한다
    editable: false
