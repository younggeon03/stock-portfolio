# Prometheus 알림 규칙. 조건이 맞으면 Alertmanager 로 넘기고, Alertmanager 가 텔레그램으로 보낸다.
# 규칙을 바꾸면 alerts.test.yml 도 같이 고친다. CI 가 promtool 로 문법과 테스트를 돌린다.
# 배포 때 deploy.sh 가 Prometheus 에 SIGHUP 을 보내 다시 읽힌다(재시작 없음).
#
# 원칙: 사람이 지금 무언가를 해야 하는 것만 알린다. "보면 좋은 것" 은 대시보드에 둔다.
# 알림이 잦으면 결국 아무도 안 본다. 그래서 for(지속 시간)를 두어 한 번 튄 값으로는 울리지 않게 한다.
# 알림 이름은 Prometheus 규칙상 영문이다. 설명(summary·description)은 한글로 쓴다.
# 설명에 {{ $value }} 같은 값을 넣지 않는다. 텔레그램 글이 매번 달라져 같은 알림끼리 묶이지 않는다

groups:
  - name: stock-portfolio
    rules:
      # 가장 중요한 하나. 긁기에 실패하면 up 이 0 이 된다(리허설: 멈추고 약 12초 뒤)
      - alert: AppDown
        expr: up{job="stock-portfolio"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "앱이 응답하지 않습니다"
          description: "Prometheus 가 2분째 앱 지표를 못 긁고 있습니다. docker compose ps 와 docker compose logs app 를 보세요. 배포 중이면 deploy.sh 가 되돌렸는지 확인하세요."

      # 토스 403 은 거의 언제나 허용 IP 문제다. 막히면 모든 종목의 시세·차트가 빈다.
      # 401 은 넣지 않는다. 재시작 직후 DB 에 둔 토큰이 만료돼 한 번 나오는 게 정상이다(CLAUDE.md)
      - alert: TossForbidden
        expr: sum(increase(http_client_requests_seconds_count{job="stock-portfolio",client_name="openapi.tossinvest.com",status="403"}[10m])) > 0
        labels:
          severity: warning
        annotations:
          summary: "토스증권이 403 으로 막았습니다"
          description: "대개 허용 IP 문제입니다. 앱 로그의 오류 문구에 지금 공인 IP 가 나옵니다. 토스 WTS > 설정 > Open API > 허용 IP 관리에서 등록하세요."

      # 바깥 API 가 연달아 실패한다. 호스트별로 묶여 어느 곳인지 알림에 나온다
      - alert: ExternalApiFailing
        expr: sum by (client_name) (increase(http_client_requests_seconds_count{job="stock-portfolio",outcome!="SUCCESS"}[15m])) >= 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "바깥 API 호출이 계속 실패합니다"
          description: "15분 동안 10번 넘게 실패했습니다. Grafana 의 외부 API 실패 칸에서 상태 코드를 보고, 운영 문서의 장애 대응 표를 찾으세요."

      # 사용자가 실제로 에러를 보고 있다. 요청이 거의 없을 때 한두 번 실패로 비율이 튀지 않게 요청 수 조건을 같이 건다
      - alert: High5xxRatio
        expr: |
          (sum(rate(http_server_requests_seconds_count{job="stock-portfolio",status=~"5..",uri!~"/actuator.*"}[10m]))
            / clamp_min(sum(rate(http_server_requests_seconds_count{job="stock-portfolio",uri!~"/actuator.*"}[10m])), 1e-9)) > 0.05
          and sum(rate(http_server_requests_seconds_count{job="stock-portfolio",uri!~"/actuator.*"}[10m])) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "서버 오류(5xx) 비율이 5% 를 넘었습니다"
          description: "10분째 요청 20건 중 1건 넘게 서버 오류입니다. docker compose logs app 에서 ERROR 를 찾으세요."

      # 힙이 한도(-Xmx512m, Dockerfile)에 붙어 있으면 곧 GC 가 멈춤을 만들고 OOM 으로 죽는다.
      # jvm_memory_max_bytes 는 -1 인 구역이 섞여 합치면 틀린다. 그래서 한도를 숫자로 둔다
      - alert: HeapNearLimit
        expr: sum(jvm_memory_used_bytes{job="stock-portfolio",area="heap"}) / 536870912 > 0.9
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "힙 메모리가 한도의 90% 를 15분째 넘었습니다"
          description: "곧 멈추거나 OOM 으로 죽을 수 있습니다. Grafana 힙 칸에서 계속 오르는지(누수) 보세요. 오르기만 하면 재배포로 버티고 원인을 찾으세요."

      # 디스크가 차면 MySQL 이 쓰기를 멈추고 Prometheus 도 죽는다. 로그·백업·이미지가 주범이다
      - alert: DiskSpaceLow
        expr: min(disk_free_bytes{job="stock-portfolio"} / disk_total_bytes{job="stock-portfolio"}) < 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "디스크 여유가 10% 밑입니다"
          description: "df -h 로 확인하세요. 오래된 이미지는 docker image prune, 오래된 백업은 backups 폴더를 보세요."

      # 프롬프트 캐싱이 죽으면 에러가 안 나고 요금만 오른다(CLAUDE.md 의 캐시읽기 0 확인을 알림으로).
      # 지난 한 시간 동안 분석을 돌렸는데 캐시 읽기가 0 이면 울린다
      - alert: ClaudePromptCacheDead
        expr: |
          sum(increase(claude_tokens_total{job="stock-portfolio",kind="analysis",type="input"}[1h])) > 0
          and sum(increase(claude_tokens_total{job="stock-portfolio",kind="analysis",type="cache_read"}[1h])) == 0
        labels:
          severity: warning
        annotations:
          summary: "기업분석 프롬프트 캐시가 안 읽힙니다"
          description: "분석을 돌렸는데 캐시 읽기 토큰이 0 입니다. 에러 없이 요금만 오르는 상태입니다. 프롬프트 조립 코드(CompanyAnalysisPromptBuilder)를 최근에 바꿨는지 보세요."

      # 돈 경보. 기준은 짐작이다. 실제로 하루 얼마나 쓰는지 Grafana 에서 몇 주 본 뒤 맞춘다
      - alert: ClaudeTokensHigh
        expr: sum(increase(claude_tokens_total{job="stock-portfolio"}[24h])) > 2000000
        labels:
          severity: warning
        annotations:
          summary: "하루 Claude 토큰이 200만을 넘었습니다"
          description: "평소보다 많이 돌렸는지, 누가 버튼을 반복해서 누르는지 보세요. 기준값은 alerts.yml 의 ClaudeTokensHigh 입니다."
