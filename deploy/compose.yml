# 운영 서버용. 개발용 ../docker-compose.yml 과 다른 점:
#  - 이미지를 빌드하지 않고 ghcr.io 에서 받은 것을 쓴다 (deploy.sh 가 stock-portfolio:current 로 붙여 둠)
#  - 앱 포트를 바깥에 열지 않는다. 바깥은 Caddy(80·443)만 받고 HTTPS 를 끝낸 뒤 앱에 넘긴다
#  - DB 비밀번호에 기본값이 없다. 비어 있으면 띄우기 전에 멈춘다
# 절차는 docs/운영.md 7장.

services:
  app:
    # 태그를 여기 쓰지 않는다. 배포·롤백은 deploy.sh 가 이 이름이 가리키는 이미지를 바꿔서 한다.
    # 그래야 백업 같은 다른 compose 명령이 실수로 다른 버전을 띄우지 않는다
    image: stock-portfolio:current
    pull_policy: never
    env_file: .env
    environment:
      DB_URL: jdbc:mysql://mysql:3306/portfolio?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      DB_USERNAME: portfolio
      DB_PASSWORD: ${COMPOSE_DB_PASSWORD:?.env 에 COMPOSE_DB_PASSWORD 를 넣으세요}
      # 서버 로그는 한 줄에 JSON 하나(requestId 로 거름). SQL 줄글이 끼면 JSON 이 깨져서 끈다. 소문자 그대로 쓴다
      LOG_FORMAT: json
      SHOW_SQL: "false"
      # 시작할 때 찍는 스프링 글자 그림도 줄글이라 끈다
      SPRING_MAIN_BANNER_MODE: "off"
    ports:
      # 헬스체크·지표는 서버 안에서만. deploy.sh 가 여기를 보고 성공/롤백을 정한다
      - "127.0.0.1:${MGMT_HOST_PORT:-8081}:8081"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    # 무료 서버 메모리(1~12GB)에서 다른 컨테이너를 밀어내지 않게. 힙은 이미지에서 512MB 로 묶었다
    mem_limit: 900m
    logging: &logging
      driver: json-file
      options: { max-size: "20m", max-file: "5" }   # 로그가 디스크를 채워 서버가 멈추는 걸 막는다

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: portfolio
      MYSQL_USER: portfolio
      MYSQL_PASSWORD: ${COMPOSE_DB_PASSWORD:?.env 에 COMPOSE_DB_PASSWORD 를 넣으세요}
      MYSQL_ROOT_PASSWORD: ${COMPOSE_DB_ROOT_PASSWORD:?.env 에 COMPOSE_DB_ROOT_PASSWORD 를 넣으세요}
      TZ: Asia/Seoul
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # 비밀번호를 명령줄에 쓰지 않으려고 컨테이너 안의 환경변수를 쓴다
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    logging: *logging

  caddy:
    image: caddy:2.8
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"   # HTTP/3
    environment:
      DOMAIN: "${DOMAIN:?.env 에 DOMAIN 을 넣으세요 (예 stock.example.com)}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 발급받은 인증서. 지우면 다시 발급받는데 Let's Encrypt 는 주당 발급 횟수 제한이 있다
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [app]
    restart: unless-stopped
    logging: *logging

  # ── 관측(선택) ── .env 의 COMPOSE_PROFILES=monitoring 일 때만 뜬다.
  # 1GB 서버에서는 앱+DB 만으로 빠듯해서 끌 수 있어야 한다. 끄면 아래 세 서비스(prometheus·grafana·alertmanager)는 compose 가 없는 것처럼 다룬다.
  #
  # 포트는 반드시 127.0.0.1 에만 묶는다. 도커가 publish 한 포트는 iptables 의 DOCKER 체인(nat PREROUTING)에서
  # 먼저 처리돼서 호스트 방화벽(INPUT 규칙, ufw 등)을 거치지 않는다. 0.0.0.0 으로 열면 방화벽을 막아 둬도
  # 인터넷에서 지표·대시보드가 보인다. 서버 밖에서 볼 때는 SSH 터널로: ssh -L 3000:127.0.0.1:3000 서버
  prometheus:
    # 3.5 는 장기 지원(LTS) 줄이다. 태그를 고정해야 서버마다 다른 버전이 뜨지 않는다. ci.yml 의 promtool 과 같은 태그로 맞춘다
    image: prom/prometheus:v3.5.5
    profiles: [monitoring]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 디스크가 작은 서버라 기간과 크기 둘 다 묶는다. 먼저 닿는 쪽이 이긴다
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=1GB
      # --web.enable-lifecycle 은 켜지 않는다. 켜면 HTTP POST 한 번으로 종료·리로드가 된다.
      # 설정 리로드는 deploy.sh 가 SIGHUP 으로 한다
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # 알림 규칙. 바꾸면 deploy.sh 의 SIGHUP 으로 같이 다시 읽힌다
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROM_HOST_PORT:-9090}:9090"
    restart: unless-stopped
    mem_limit: 256m
    logging: *logging

  grafana:
    # OSS 판. 태그 고정 (latest 는 메이저가 바뀌면 대시보드 형식이 바뀔 수 있다)
    image: grafana/grafana:12.1.10
    profiles: [monitoring]
    # 비밀번호가 비면 Grafana 는 기본값 admin/admin 으로 뜬다. 그걸 막으려고 띄우기 전에 검사한다.
    # compose 의 ${VAR:?} 를 못 쓰는 이유: compose 는 profile 이 꺼진 서비스의 변수도 해석해서,
    # 관측을 끈 서버(비밀번호를 안 넣은 서버)에서 앱 배포까지 막힌다. 그래서 컨테이너 안에서 막는다.
    # "# " 으로 시작하는 값도 막는다. .env 에 "KEY=   # 설명" 으로 남기면 compose 는 주석을 값으로 읽는다(리허설에서 확인).
    # "#abc" 처럼 # 이 바로 붙은 값은 정상 비밀번호라 통과시킨다(검수에서 지적)
    entrypoint:
      - /bin/sh
      - -c
      - 'case "$$GF_SECURITY_ADMIN_PASSWORD" in ""|"# "*) echo "GRAFANA_ADMIN_PASSWORD 가 비어 있어 뜨지 않고 멈춥니다" >&2; exit 1;; esac; exec /run.sh'
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # 바깥으로 사용 통계·업데이트 확인을 보내지 않는다
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # 12 버전은 기동 때 기본 플러그인을 인터넷에서 받는다. 안 쓰는 데다 기동이 느려지고 바깥 접속이 생긴다
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      # 데이터소스·대시보드는 파일이 원본이다. 화면에서 고쳐도 저장되지 않게 읽기 전용으로 붙인다
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3000}:3000"
    depends_on: [prometheus]
    restart: unless-stopped
    mem_limit: 256m
    logging: *logging

  alertmanager:
    # Prometheus 가 넘긴 경보를 묶고 텔레그램으로 보낸다. ARM(오라클) 이미지 확인함
    image: prom/alertmanager:v0.30.0
    profiles: [monitoring]
    # 텔레그램 값이 둘 다 있으면 telegram.yml, 아니면 quiet.yml(보내지 않고 쌓기만).
    # 봇 토큰은 파일로만 넘긴다. 설정 파일·명령줄(ps 로 보임)에 토큰이 남지 않게.
    # chat_id 는 숫자(그룹은 음수)만 받는다. 그 밖의 글자가 sed 로 설정에 끼어들지 못하게 먼저 거른다
    entrypoint:
      - /bin/sh
      - -c
      - |
        cfg=/etc/alertmanager/conf/quiet.yml
        case "$$TELEGRAM_CHAT_ID" in
          ""|*[!0-9-]*) [ -n "$$TELEGRAM_CHAT_ID" ] && echo "TELEGRAM_CHAT_ID 가 숫자가 아니라 텔레그램으로 보내지 않습니다" >&2 ;;
          *) if [ -n "$$TELEGRAM_BOT_TOKEN" ]; then
               printf '%s' "$$TELEGRAM_BOT_TOKEN" > /tmp/bot_token
               sed "s/__CHAT_ID__/$$TELEGRAM_CHAT_ID/" /etc/alertmanager/conf/telegram.yml > /tmp/alertmanager.yml
               cfg=/tmp/alertmanager.yml
             fi ;;
        esac
        echo "Alertmanager 설정: $$cfg"
        exec /bin/alertmanager --config.file="$$cfg" --storage.path=/alertmanager --web.listen-address=:9093
    environment:
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID:-}"
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager/conf:ro
      # 보낸 기록·무음 설정. 재시작해도 같은 경보를 또 보내지 않게 남긴다
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:${ALERTMANAGER_HOST_PORT:-9093}:9093"
    restart: unless-stopped
    mem_limit: 64m
    logging: *logging

volumes:
  mysql-data:
  caddy-data:
  caddy-config:
  prometheus-data:
  grafana-data:
  alertmanager-data:
