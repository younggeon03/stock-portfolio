<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>로그인 — 기관 포트폴리오</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>📈</text></svg>">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-kr@5.2.5/700.css">
    <link rel="stylesheet" href="/public/tokens.css">
    <link rel="stylesheet" href="/public/site.css">
    <link rel="stylesheet" href="/public/nav.css">
</head>
<body>
<div class="wrap">
    <header class="site-head">
        <a class="brand" href="/">포트폴리오 분석기</a>
    </header>

    <main id="main" class="login">
        <span class="kicker">운영자 전용</span>
        <h1>내 포트폴리오 로그인</h1>
        <p class="lead">운영자 전용입니다. 공개 화면은 <a href="/">첫 화면</a>에서 로그인 없이 볼 수 있습니다.</p>
        <form id="form" class="login-form">
            <label for="username">아이디</label>
            <input id="username" name="username" autocomplete="username" required>
            <label for="password">비밀번호</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <p class="error" id="error" role="alert" hidden></p>
            <button type="submit" class="primary">로그인</button>
        </form>
    </main>
</div>
<script src="/public/login.js"></script>
<script src="/public/nav.js"></script>
</body>
</html>
