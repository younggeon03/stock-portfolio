server:
  port: 8080

spring.servlet.multipart:
  # 스크린샷 업로드 한도. 휴대폰 캡처가 보통 1~3MB 라 넉넉히 잡는다.
  max-file-size: 10MB
  max-request-size: 10MB

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/portfolio?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      # 개발 편의를 위해 엔티티 변경사항을 자동으로 테이블에 반영한다 (운영에서는 flyway 등으로 교체 권장)
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: true

# 토스증권 Open API 설정.
# ${TOSS_CLIENT_ID:} 는 "TOSS_CLIENT_ID 값이 있으면 쓰고, 없으면 빈 문자열" 이라는 뜻이다.
# 값이 비어 있어도 앱은 정상적으로 뜨고, 실제 API 를 부르는 순간 TossAuthService 가
# "무엇을 채워야 하는지" 알려주는 에러를 던진다.
toss:
  base-url: https://openapi.tossinvest.com
  client-id: ${TOSS_CLIENT_ID:}
  client-secret: ${TOSS_CLIENT_SECRET:}
  # 사용할 계좌 번호. 비워두면 계좌 목록의 첫 번째 계좌를 자동으로 쓴다.
  account-seq: ${TOSS_ACCOUNT_SEQ:}

# 나무증권(NAMUH PLUG) Open API 설정.
# 주의: 서버 주소에 포트 8443 이 반드시 붙는다.
namuh:
  base-url: https://api.nhplug.com:8443
  app-key: ${NAMUH_APP_KEY:}
  app-secret: ${NAMUH_APP_SECRET:}
  # 사용할 계좌번호. 비워두면 계좌 목록의 첫 번째 계좌를 자동으로 쓴다.
  account-no: ${NAMUH_ACCOUNT_NO:}

# Claude(Anthropic) 설정. 기업분석에만 쓴다.
# 키가 비어 있어도 앱은 정상적으로 뜬다. 실제로 "기업 분석" 을 누르는 순간
# 무엇을 채워야 하는지 알려주는 에러가 뜬다.
anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  model: claude-opus-5
  # LOW / MEDIUM / HIGH / XHIGH / MAX. 높을수록 깊게 생각하고 비싸다.
  effort: HIGH
  max-tokens: 16000
  # 한 번 분석할 때 허용할 웹검색 횟수. 늘리면 정확해지지만 비싸진다.
  web-search-max-uses: 8
  # 클로드 응답이 오래 걸리므로 넉넉히 준다.
  timeout-minutes: 10
  # 이 일수가 지난 분석은 화면에 "오래됨" 으로 표시한다.
  cache-days: 7
  # 스크린샷을 보내기 전에 줄일 긴 변의 최대 길이(px).
  # 이미지 토큰은 (가로/28) x (세로/28) 이라 변을 줄이면 값이 제곱으로 준다.
  # 휴대폰 캡처 2532px 기준 2000 이면 약 38% 절감이다.
  # 더 줄이면 더 싸지지만 작은 숫자를 잘못 읽기 시작한다. 진짜 캡처로 확인하고 내리세요.
  screenshot-max-edge: 2000
  # 뉴스 인사이트에만 쓰는 모델. 헤드라인을 세 줄로 묶는 일이라 싼 모델로 충분하다(값 10분의 1).
  # 비우면 위의 model 을 쓴다. 요약이 엉성하면 비워서 되돌리세요.
  news-model: claude-haiku-4-5-20251001

# DART(금융감독원 전자공시) OpenAPI. 국내 종목의 재무를 공시 원본으로 가져온다.
# 키가 비어 있으면 재무를 붙이지 않고 예전처럼 클로드가 웹에서 찾는다. 하루 2만 건까지 무료.
dart:
  base-url: https://opendart.fss.or.kr
  api-key: ${DART_API_KEY:}

# SEC EDGAR. 미국 종목의 재무를 공시 원본으로 가져온다. 키는 없고 무료다.
# 대신 SEC 가 "앱이름 연락처이메일" 형식의 User-Agent 를 요구한다. 없으면 www.sec.gov 가 403 을 준다.
# 비어 있으면 미국 종목 재무를 붙이지 않고 예전처럼 클로드가 웹에서 찾는다.
sec:
  user-agent: ${SEC_USER_AGENT:}
