server:
  port: 8080
  # 서버에서는 앞단(Caddy)이 HTTPS 를 받고 HTTP 로 넘긴다. 원래 요청이 https 였다는 헤더를 믿어야
  # 로그인 뒤 돌아가는 주소가 http 로 바뀌지 않는다
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 12h
      cookie:
        # 다른 사이트에서 온 요청에는 로그인 쿠키를 아예 안 붙인다. CSRF 를 한 겹 더 막는다
        same-site: strict
        http-only: true
        # HTTPS 뒤에서는 true. 내 PC(http)에서 true 면 로그인이 안 된다
        secure: ${COOKIE_SECURE:false}
  # 들어오는 연결(Tomcat). 기본값에 맡기지 않고 작은 서버(앱 메모리 한도 900MB)에 맞춰 정한다
  tomcat:
    threads:
      # 요청 하나가 스레드 하나. 바깥 API 를 기다리는 동안에도 스레드를 쥐고 있다(최대 30초).
      # 기본 200 은 이 서버에 넘친다. k6 에서 동시 30명이 문제없었고, 넉넉히 100
      max: 100
      min-spare: 10
    # 스레드가 다 차면 연결은 받아 두고 기다린다(최대 2000). 그것도 차면 커널 대기열(accept-count)에 줄을 선다.
    # accept-count 는 커널 net.core.somaxconn 보다 클 수 없다. 리눅스 5.4 이상은 기본 4096 이라 따로 올리지 않는다
    max-connections: 2000
    accept-count: 100
    # 연결만 맺고 요청을 안 보내는 클라이언트를 10초 뒤 끊는다(기본 60초)
    connection-timeout: 10s
    # 앞단 Caddy 가 연결을 다시 쓴다. Caddy 의 keepalive(30초)보다 길어야 Caddy 가 닫힌 연결에 요청을 싣지 않는다
    keep-alive-timeout: 60s
    # 기본 100번 쓰면 연결을 닫는다. Caddy 하나만 붙으므로 넉넉히
    max-keep-alive-requests: 1000
    # tomcat_threads_busy·tomcat_connections_current 같은 지표를 켠다. 위 숫자가 맞는지 보려면 실제 사용량이 보여야 한다
    mbeanregistry:
      enabled: true

# 운영 상태 주소. 앱 포트(8080)와 나눠 관리 포트에만 연다.
# 서버에서는 8080 만 바깥에 열고 8081 은 안쪽(자동 배포의 헬스체크, Prometheus)에서만 부른다.
# 지표에는 호출한 주소와 오류 수가 그대로 보여서 바깥에 내놓을 이유가 없다.
management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      # 자동 배포는 "떴나(liveness)" 와 "요청을 받을 준비가 됐나(readiness, DB 포함)" 를 따로 본다
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          # DB 가 죽었는데 "준비됨" 이라고 하면 자동 배포가 깨진 버전을 통과시킨다
          include: readinessState,db
  metrics:
    tags:
      application: stock-portfolio
    # 응답 시간 분포. 평균·최댓값만으로는 "대부분은 빠른데 가끔 느림" 을 못 본다.
    # 버킷(경계)을 몇 개로만 정한다. 퍼센타일 히스토그램을 통째로 켜면 주소·상태마다 수십 개 시계열이 생겨
    # 작은 서버의 Prometheus 디스크를 채운다. 이 경계로 Grafana 에서 대략의 p95 와 "1초 넘은 비율" 을 본다
    distribution:
      slo:
        http.server.requests: 100ms,300ms,1s,3s
        http.client.requests: 300ms,1s,3s,10s

# 증권사 토큰을 DB 에 넣기 전에 암호화하는 키 (base64, 32바이트). 비우면 평문으로 저장하고 기동 때 경고한다.
# 만드는 법은 .env.example 7번. 키를 바꾸면 저장된 토큰을 못 풀어 한 번씩 새로 발급받는다.
security:
  token-encryption-key: ${TOKEN_ENCRYPTION_KEY:}
  # 내 영역(잔고·유료 버튼) 로그인. 비밀번호가 비면 전부 열어 두고 기동 때 경고한다 (내 PC 개발용).
  # 서버에서는 반드시 넣는다
  owner:
    username: ${OWNER_USERNAME:owner}
    password: ${OWNER_PASSWORD:}

# Swagger. 서버에서는 SWAGGER_ENABLED=false 로 끈다. 주소 목록이 공격 지도가 되기 때문이다.
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}

spring.servlet.multipart:
  # 스크린샷 업로드 한도. 휴대폰 캡처가 보통 1~3MB 라 넉넉히 잡는다.
  max-file-size: 10MB
  max-request-size: 10MB

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/portfolio?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    # DB 연결(HikariCP 풀 + MySQL 드라이버 소켓). 바깥 API 에는 타임아웃을 걸었는데 DB 에는 없었다.
    # DB 가 응답 없이 멈추면 쿼리가 끝없이 기다리고, 그 요청의 톰캣 스레드도 같이 묶인다
    hikari:
      maximum-pool-size: 10
      # 풀이 다 쓰였을 때 빈 연결을 기다리는 상한(기본 30초). 오래 기다리기보다 빨리 실패하고 알린다
      connection-timeout: 3000
      validation-timeout: 2000
      # 연결은 30분마다 새로 맺는다. MySQL 의 wait_timeout(기본 8시간)이나 중간 장비가 먼저 끊기 전에
      max-lifetime: 1800000
      # 5분 놀던 연결은 가볍게 확인해 살려 둔다(방화벽·NAT 가 조용히 끊는 것을 막는다)
      keepalive-time: 300000
      data-source-properties:
        # TCP 연결을 맺는 데 3초, 쿼리 응답을 기다리는 데 60초. 가장 긴 쿼리(13F 저장)보다 넉넉히.
        # 아주 오래 걸리는 마이그레이션을 새로 넣으면 이 값에 걸리니 그때 늘린다
        connectTimeout: 3000
        socketTimeout: 60000
        tcpKeepAlive: true
  flyway:
    # Flyway 를 붙이기 전부터 테이블이 있던 DB(내 PC)는 V1 을 실행하지 않고 "V1 적용됨" 으로만 표시한다.
    # 빈 DB(도커·서버)는 V1 부터 실행한다
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    hibernate:
      # 스키마는 Flyway(db/migration)가 만든다. Hibernate 는 엔티티와 테이블이 맞는지 검사만 한다.
      # 엔티티를 고쳤는데 마이그레이션을 안 만들면 여기서 기동이 멈춘다. 그게 의도다.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    # SQL 을 화면에 찍는다. 내 PC 에서 쿼리를 보려고 켜 두고 서버에서는 끈다(SHOW_SQL=false).
    # 이건 로거가 아니라 System.out 으로 바로 나가서, 서버의 JSON 로그 사이에 줄글이 끼어 jq 가 깨진다
    show-sql: ${SHOW_SQL:true}

# 로그 모양. text(내 PC, 줄글) 또는 json(서버, 한 줄에 JSON 하나). logback-spring.xml 참고
logging:
  appender: ${LOG_FORMAT:text}

# 토스증권 Open API 설정.
# ${TOSS_CLIENT_ID:} 는 "TOSS_CLIENT_ID 값이 있으면 쓰고, 없으면 빈 문자열" 이라는 뜻이다.
# 값이 비어 있어도 앱은 정상적으로 뜨고, 실제 API 를 부르는 순간 TossAuthService 가
# "무엇을 채워야 하는지" 알려주는 에러를 던진다.
toss:
  base-url: https://openapi.tossinvest.com
  client-id: ${TOSS_CLIENT_ID:}
  client-secret: ${TOSS_CLIENT_SECRET:}
  # 사용할 계좌 번호. 비워두면 계좌 목록의 첫 번째 계좌를 자동으로 쓴다.
  account-seq: ${TOSS_ACCOUNT_SEQ:}

# 나무증권(NAMUH PLUG) Open API 설정.
# 주의: 서버 주소에 포트 8443 이 반드시 붙는다.
namuh:
  base-url: https://api.nhplug.com:8443
  app-key: ${NAMUH_APP_KEY:}
  app-secret: ${NAMUH_APP_SECRET:}
  # 사용할 계좌번호. 비워두면 계좌 목록의 첫 번째 계좌를 자동으로 쓴다.
  account-no: ${NAMUH_ACCOUNT_NO:}

# Claude(Anthropic) 설정. 기업분석에만 쓴다.
# 키가 비어 있어도 앱은 정상적으로 뜬다. 실제로 "기업 분석" 을 누르는 순간
# 무엇을 채워야 하는지 알려주는 에러가 뜬다.
anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  model: claude-opus-5
  # LOW / MEDIUM / HIGH / XHIGH / MAX. 높을수록 깊게 생각하고 비싸다.
  effort: HIGH
  max-tokens: 16000
  # 한 번 분석할 때 허용할 웹검색 횟수. 늘리면 정확해지지만 비싸진다.
  # 8 → 5 (2026-10-06): 재무·과거 배수·뉴스 제목·기관 보유를 프롬프트에 넣어 검색할 주제가
  # 컨센서스·가이던스·매출 구성·산업 동향 넷으로 줄었다. 검색 한 번은 결과 글 수천 토큰을 끌고 와 이어 부를 때마다 다시 실린다
  web-search-max-uses: 5
  # 클로드 응답이 오래 걸리므로 넉넉히 준다.
  timeout-minutes: 10
  # 이 일수가 지난 분석은 화면에 "오래됨" 으로 표시한다.
  cache-days: 7
  # 스크린샷을 보내기 전에 줄일 긴 변의 최대 길이(px).
  # 이미지 토큰은 (가로/28) x (세로/28) 이라 변을 줄이면 값이 제곱으로 준다.
  # 휴대폰 캡처 2532px 기준 2000 이면 약 38% 절감이다.
  # 더 줄이면 더 싸지지만 작은 숫자를 잘못 읽기 시작한다. 진짜 캡처로 확인하고 내리세요.
  screenshot-max-edge: 2000
  # 뉴스 인사이트에만 쓰는 모델. 헤드라인을 세 줄로 묶는 일이라 싼 모델로 충분하다(값 10분의 1).
  # 비우면 위의 model 을 쓴다. 요약이 엉성하면 비워서 되돌리세요.
  news-model: claude-haiku-4-5-20251001

# DART(금융감독원 전자공시) OpenAPI. 국내 종목의 재무를 공시 원본으로 가져온다.
# 키가 비어 있으면 재무를 붙이지 않고 예전처럼 클로드가 웹에서 찾는다. 하루 2만 건까지 무료.
dart:
  base-url: https://opendart.fss.or.kr
  api-key: ${DART_API_KEY:}

# SEC EDGAR. 미국 종목의 재무를 공시 원본으로 가져온다. 키는 없고 무료다.
# 대신 SEC 가 "앱이름 연락처이메일" 형식의 User-Agent 를 요구한다. 없으면 www.sec.gov 가 403 을 준다.
# 비어 있으면 미국 종목 재무를 붙이지 않고 예전처럼 클로드가 웹에서 찾는다.
sec:
  user-agent: ${SEC_USER_AGENT:}

# 기관 투자자 포트폴리오 (SEC 13F). 위의 SEC 연락처를 같이 쓴다. 없으면 배치가 조용히 건너뛴다.
thirteenf:
  # 기관마다 남길 분기 수. 분기 변화·여러 분기 추세에 쓴다
  quarters: 8
  # 매일 받는 시각 (한국 시간). 초 분 시 일 월 요일
  sync-cron: "0 0 7 * * *"

# CUSIP → 티커 변환 (OpenFIGI). 키가 없어도 동작하지만 느리다 (분당 250개 → 키가 있으면 훨씬 빠름).
# 무료 키: https://www.openfigi.com/api
openfigi:
  api-key: ${OPENFIGI_API_KEY:}

# 장 마감 스냅샷과 대사 (PortfolioSnapshotService). 평일 16:10 에 찍고 18:10·20:10 은 실패했을 때만 다시 시도
snapshot:
  cron: "0 10 16,18,20 * * MON-FRI"
  # 직접 입력한 종목까지 넣으려면 나의 포트폴리오 화면의 식별값(브라우저 localStorage 의 portfolioOwnerKey).
  # 비우면 증권사 보유만 찍는다. 배치에는 브라우저가 없어서 누구의 직접 입력인지 알 수 없다
  owner-key: ${SNAPSHOT_OWNER_KEY:}

# 공시 재무 야간 배치 (FilingPrefetchService). 보유·분석해 둔 종목의 공시 재무를 새벽에 미리 받아 둔다.
# 13F(07:00) 보다 앞. 직접 입력한 종목의 식별값은 위 스냅샷 것을 같이 쓴다
filing:
  prefetch:
    cron: "0 0 6 * * *"
    # 종목 사이에 쉬는 시간. 공시처·토스 호출 한도 배려
    pause-ms: 500

# 이 앱의 바깥 주소. 피드·알림 글 속 링크에 쓴다. 서버에서는 https://도메인
app:
  base-url: ${APP_BASE_URL:http://localhost:8080}

# 새 13F 를 텔레그램 채널로 알린다. 둘 다 있어야 켜진다. 만드는 법은 TelegramNotifier 주석과 docs/운영.md
telegram:
  bot-token: ${TELEGRAM_BOT_TOKEN:}
  chat-id: ${TELEGRAM_CHAT_ID:}

# 공개 API 요청 제한 (IP 당 분당). 배당 캘린더는 처음 보는 종목마다 DART 를 불러 더 낮게 둔다
rate-limit:
  public-per-minute: 120
  dividends-per-minute: 15
